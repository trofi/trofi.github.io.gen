[package]
name = "site"
version = "0.0.0"
edition = "2024"

[dependencies]
atom_syndication = "0"
chrono = "0"
clap = "4"
clap-verbosity-flag = "3"
comrak = "1"
env_logger = "0"
glob = "0"
log = "0"
lol_html = "3"
math-core = "0"
maud = "0"
rss = { version = "2", features = ["atom"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
url = "2"
yaml_serde = "0"
